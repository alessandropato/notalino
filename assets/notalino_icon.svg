             A 232 232 0 1 0 300 566
             L 372 760
             Z" />
    <!-- Waveform audio -->
    <path d="M 352 512
             L 378 512
             L 396 452
             L 414 574
             L 432 420
             L 450 588
             L 468 462
             L 486 548
             L 504 500
             L 524 512" stroke-width="22" />
    <!-- Documento con angolo piegato -->
    <path d="M 566 452
             L 626 452
             L 668 494
             L 668 578
             L 566 578
             Z" stroke-width="22" />
    <path d="M 626 452 L 626 494 L 668 494" stroke-width="20" />
    <path d="M 590 520 L 644 520" stroke-width="18" />
    <path d="M 590 552 L 630 552" stroke-width="18" />
    <!-- Scintilla (4 punte) in alto a destra -->
    <path d="M 726 300
             C 730 344 742 356 786 360
             C 742 364 730 376 726 420
             C 722 376 710 364 666 360
             C 710 356 722 344 726 300 Z"
