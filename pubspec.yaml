name: notalino
description: "Notalino — trascrizione e analisi AI delle riunioni. © Maketron"
publish_to: 'none'
version: 0.0.8+8

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (SRD §3): Riverpod scelto per composabilità, testabilità
  # dei provider e assenza di boilerplate rispetto a Bloc. Provider scritti a
  # mano (niente codegen), quindi non servono riverpod_annotation/generator.
  flutter_riverpod: ^3.4.1

  # Database locale relazionale (SRD §3, §5): Drift (SQLite tipizzato) per le
  # relazioni progetti↔riunioni↔registrazioni.
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # Storage sicuro chiavi (Keychain iOS / Keystore Android) — SRD §12.
  flutter_secure_storage: ^10.3.1

  # Networking con retry/interceptor — SRD §3.
  dio: ^5.7.0

  # Ricezione file dalla share sheet iOS / intent Android — SRD §6.
  receive_sharing_intent: ^1.8.1

  # Selezione file (aggiunta registrazioni manuale) — SRD §6bis.
  file_picker: ^11.0.2

  # Condivisione/export del verbale Markdown — SRD §6.4, §8ter.
  # 12.x è l'ultima linea con win32 ^5: da share_plus 13 serve win32 ^6, che è
  # incompatibile con file_picker 11 (win32 ^5, il cui file Windows viene
  # compilato dal frontend Dart anche su iOS via export condizionali).
  # API SharePlus.instance/ShareParams già presente dalla 10.
  share_plus: ^12.0.2

  # Elaborazione audio (split/decodifica per il chunking) — SRD §7.
  # ffmpeg_kit_flutter_new è il fork mantenuto (l'originale è stato ritirato).
  # 4.x distribuisce XCFramework con slice arm64-simulatore (Apple Silicon).
  ffmpeg_kit_flutter_new: ^4.5.3

  # Mantiene lo schermo acceso durante trascrizione/analisi: su iOS il blocco
  # schermo sospende l'app e le richieste di rete in corso restano appese
  # senza mai andare in errore (causa nota di "trascrizione bloccata" su
  # riunioni lunghe, dove l'attesa supera facilmente l'auto-lock).
  wakelock_plus: ^1.2.10

  # Note vocali: registra un breve audio e lo trascrive con Whisper per
  # compilare i campi di testo (contesto, chat) a voce invece che a tastiera.
  record: ^7.1.1

  # Utilità
  uuid: ^4.5.1
  flutter_svg: ^2.0.10 # logo/icona vettoriale in-app
  flutter_markdown: ^0.7.4
  collection: ^1.18.0
  meta: ^1.15.0 # @immutable nelle entità di dominio (Dart puro, no Flutter)

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  # Vincoli-pavimento: pub sceglie le massime versioni compatibili con l'SDK
  # Flutter (che pinna `meta`); evita conflitti con analyzer/meta.
  drift_dev: ^2.34.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.1 # genera le icone app dal PNG

# Icona app generata dal logo Notalino (dart run flutter_launcher_icons).
flutter_launcher_icons:
  image_path: "assets/notalino_icon_1024.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/notalino_icon.svg
