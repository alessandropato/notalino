# Lint rigoroso per Notalino (SRD §13). Base flutter_lints + regole extra.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    todo: ignore
  exclude:
    - "**/*.g.dart"       # codice generato (Drift, Riverpod)
    - "**/*.freezed.dart"

linter:
  rules:
    always_declare_return_types: true
    avoid_dynamic_calls: true
    prefer_final_locals: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    unnecessary_await_in_return: true
    use_super_parameters: true
    directives_ordering: true
    sort_child_properties_last: true
    unawaited_futures: true
    # I servizi/use case usano campi privati + parametri named per la DI: il
    # pattern è intenzionale e non è esprimibile con initializing formals.
    prefer_initializing_formals: false
